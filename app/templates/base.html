{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReporTi{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body>

<nav class="sidebar">
    <span class="brand">ReporTi</span>
    <ul class="nav flex-column gap-1">
        <li>
            <a href="/" class="nav-link {% block nav_dashboard %}{% endblock %}">
                <i class="bi bi-speedometer2 me-2"></i>Dashboard
            </a>
        </li>
        <li>
            <a href="/tickets/" class="nav-link {% block nav_tickets %}{% endblock %}">
                <i class="bi bi-ticket-perforated me-2"></i>Tickets
            </a>
        </li>
        <li>
            <a href="/dispositivos/" class="nav-link {% block nav_dispositivos %}{% endblock %}">
                <i class="bi bi-pc-display me-2"></i>Dispositivos
            </a>
        </li>
        <li>
            <a href="/salas/" class="nav-link {% block nav_salas %}{% endblock %}">
                <i class="bi bi-door-open me-2"></i>Salas
            </a>
        </li>
    </ul>
    <div class="mt-auto">
        <button class="btn logout-btn w-100" onclick="logout()">
            <i class="bi bi-box-arrow-right me-1"></i>Sair
        </button>
    </div>
</nav>

<div class="main-wrapper">
    <header class="page-header">
        <h5>{% block page_title %}{% endblock %}</h5>
        <span class="text-muted small" id="current-user"></span>
    </header>
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = '/api';

    function getToken() { return localStorage.getItem('access'); }

    function logout() {
        localStorage.clear();
        window.location.href = '/login/';
    }

    async function authFetch(url, opts = {}) {
        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getToken()}`,
            ...(opts.headers || {}),
        };
        return fetch(url, { ...opts, headers });
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (!getToken()) { window.location.href = '/login/'; return; }
        const user = localStorage.getItem('username');
        if (user) document.getElementById('current-user').textContent = user;
    });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
