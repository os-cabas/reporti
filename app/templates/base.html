{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReporTi{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-top">
        <a href="/" class="brand">
            <span class="brand-icon"><i class="bi bi-ticket-fill"></i></span>
            ReporTi
        </a>
    </div>

    <div class="sidebar-nav">
        <a href="/" class="nav-link {% block nav_dashboard %}{% endblock %}">
            <i class="bi bi-speedometer2"></i>Dashboard
        </a>
        <a href="/tickets/" class="nav-link {% block nav_tickets %}{% endblock %}">
            <i class="bi bi-ticket-perforated"></i>Tickets
        </a>

        <div class="nav-section-label">Infraestrutura</div>
        <a href="/dispositivos/" class="nav-link {% block nav_dispositivos %}{% endblock %}">
            <i class="bi bi-pc-display"></i>Dispositivos
        </a>
        <a href="/salas/" class="nav-link {% block nav_salas %}{% endblock %}">
            <i class="bi bi-door-open"></i>Salas
        </a>
        <a href="/entidades/" class="nav-link {% block nav_entidades %}{% endblock %}">
            <i class="bi bi-building"></i>Entidades
        </a>

        <div class="nav-section-label">Cadastros</div>
        <a href="/categorias/" class="nav-link {% block nav_categorias %}{% endblock %}">
            <i class="bi bi-tags"></i>Categorias
        </a>
        <a href="/modelos/" class="nav-link {% block nav_modelos %}{% endblock %}">
            <i class="bi bi-box"></i>Modelos
        </a>

        <div class="nav-section-label">Admin</div>
        <a href="/usuarios/" class="nav-link {% block nav_usuarios %}{% endblock %}">
            <i class="bi bi-people"></i>Usuários
        </a>
        <a href="/permissoes/" class="nav-link {% block nav_permissoes %}{% endblock %}">
            <i class="bi bi-shield-check"></i>Permissões
        </a>
    </div>

    <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>Sair
        </button>
    </div>
</nav>

<div class="main-wrapper">
    <header class="page-header">
        <h5>{% block page_title %}{% endblock %}</h5>
        <div class="page-header-user">
            <div class="user-avatar" id="user-avatar">—</div>
            <span id="current-user"></span>
        </div>
    </header>
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</div>

<!-- Toast container -->
<div class="toast-stack" id="toast-stack"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = '/api';

    function getToken() { return localStorage.getItem('access'); }

    function logout() {
        localStorage.clear();
        window.location.href = '/login/';
    }

    async function authFetch(url, opts = {}) {
        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getToken()}`,
            ...(opts.headers || {}),
        };
        return fetch(url, { ...opts, headers });
    }

    function toast(msg, type = 'default', duration = 3500) {
        const stack = document.getElementById('toast-stack');
        const icons = {
            default: 'bi-info-circle-fill',
            success: 'bi-check-circle-fill',
            error:   'bi-x-circle-fill',
            warn:    'bi-exclamation-triangle-fill',
        };
        const el = document.createElement('div');
        el.className = `toast-item toast-${type}`;
        el.innerHTML = `<i class="bi ${icons[type] || icons.default}"></i><span>${msg}</span>`;
        stack.appendChild(el);
        setTimeout(() => {
            el.style.animation = 'toast-slide-out .25s ease forwards';
            el.addEventListener('animationend', () => el.remove(), { once: true });
        }, duration);
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (!getToken()) { window.location.href = '/login/'; return; }
        const username = localStorage.getItem('username') || '';
        if (username) {
            document.getElementById('current-user').textContent = username;
            const initials = username.slice(0, 2).toUpperCase();
            document.getElementById('user-avatar').textContent = initials;
        }
    });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
