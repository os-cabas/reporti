{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReporTI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-top">
        <a href="/" class="brand">
            <span class="brand-icon"><i class="bi bi-ticket-fill"></i></span>
            ReporTI
        </a>
    </div>

    <div class="sidebar-nav">
        <a href="/" class="nav-link {% block nav_dashboard %}{% endblock %}">
            <i class="bi bi-speedometer2"></i>Dashboard
        </a>
        <a href="/tickets/" class="nav-link {% block nav_tickets %}{% endblock %}">
            <i class="bi bi-ticket-perforated"></i>Tickets
        </a>

        <div class="nav-section-label">Infraestrutura</div>
        <a href="/dispositivos/" class="nav-link {% block nav_dispositivos %}{% endblock %}">
            <i class="bi bi-pc-display"></i>Dispositivos
        </a>
        <a href="/salas/" class="nav-link {% block nav_salas %}{% endblock %}">
            <i class="bi bi-door-open"></i>Salas
        </a>
        <a href="/entidades/" class="nav-link {% block nav_entidades %}{% endblock %}">
            <i class="bi bi-building"></i>Entidades
        </a>

        <div class="nav-section-label">Cadastros</div>
        <a href="/categorias/" class="nav-link {% block nav_categorias %}{% endblock %}">
            <i class="bi bi-tags"></i>Categorias
        </a>
        <a href="/modelos/" class="nav-link {% block nav_modelos %}{% endblock %}">
            <i class="bi bi-box"></i>Modelos
        </a>

        <div class="nav-section-label">Admin</div>
        <a href="/usuarios/" class="nav-link {% block nav_usuarios %}{% endblock %}">
            <i class="bi bi-people"></i>Usuários
        </a>
        <a href="/permissoes/" class="nav-link {% block nav_permissoes %}{% endblock %}">
            <i class="bi bi-shield-check"></i>Permissões
        </a>
    </div>

    <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>Sair
        </button>
    </div>
</nav>

<div class="main-wrapper">
    <header class="page-header">
        <div class="d-flex align-items-center gap-3">
            <h5 class="m-0">{% block page_title %}{% endblock %}</h5>
            
            <div class="dropdown" id="header-entity-dropdown-wrap" style="display: none;">
                <button class="entity-dropdown-btn dropdown-toggle" type="button" id="header-entity-dropdown-btn" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-building text-primary"></i>
                    <span id="header-entity-name">Selecionar Entidade</span>
                </button>
                <ul class="dropdown-menu entity-dropdown-menu" id="header-entity-dropdown-menu" aria-labelledby="header-entity-dropdown-btn">
                    <!-- Renderizado dinamicamente -->
                </ul>
            </div>
        </div>
        <div class="page-header-user">
            <div class="user-avatar" id="user-avatar">—</div>
            <span id="current-user"></span>
        </div>
    </header>
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</div>

<!-- Toast container -->
<div class="toast-stack" id="toast-stack"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = '/api';

    function getToken() { return localStorage.getItem('access'); }

    function logout() {
        localStorage.clear();
        window.location.href = '/login/';
    }

    async function authFetch(url, opts = {}) {
        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getToken()}`,
            ...(opts.headers || {}),
        };
        return fetch(url, { ...opts, headers });
    }

    function toast(msg, type = 'default', duration = 3500) {
        const stack = document.getElementById('toast-stack');
        const icons = {
            default: 'bi-info-circle-fill',
            success: 'bi-check-circle-fill',
            error:   'bi-x-circle-fill',
            warn:    'bi-exclamation-triangle-fill',
        };
        const el = document.createElement('div');
        el.className = `toast-item toast-${type}`;
        el.innerHTML = `<i class="bi ${icons[type] || icons.default}"></i><span>${msg}</span>`;
        stack.appendChild(el);
        setTimeout(() => {
            el.style.animation = 'toast-slide-out .25s ease forwards';
            el.addEventListener('animationend', () => el.remove(), { once: true });
        }, duration);
    }

    async function checkEntityContext() {
        const path = window.location.pathname;
        const needsEntity = path.includes('/dispositivos/') || path.includes('/salas/') || path.includes('/tickets/') || path === '/' || path.includes('/dashboard/');
        
        const dropdownWrap = document.getElementById('header-entity-dropdown-wrap');
        if (!needsEntity) {
            dropdownWrap.style.display = 'none';
            return;
        }

        dropdownWrap.style.display = 'block';

        try {
            const res = await authFetch(`${API}/entidades/`);
            if (res.ok) {
                const data = await res.json();
                const list = Array.isArray(data) ? data : data.results || [];
                const menu = document.getElementById('header-entity-dropdown-menu');
                
                if (list.length === 0) {
                    menu.innerHTML = '<li><span class="dropdown-item text-muted small">Nenhuma entidade cadastrada</span></li>';
                    return;
                }

                const currentId = localStorage.getItem('selected_entidade_id') || 'todas';

                let menuHtml = `
                    <li>
                        <button class="entity-dropdown-item ${currentId === 'todas' ? 'active' : ''}" type="button" onclick="selectEntity('todas', 'Geral')">
                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-globe text-primary"></i>
                                <span>Geral</span>
                            </div>
                            ${currentId === 'todas' ? '<i class="bi bi-check2 text-primary fs-6"></i>' : ''}
                        </button>
                    </li>
                `;

                if (list.length > 0) {
                    menuHtml += `<li><hr class="dropdown-divider my-1"></li>`;
                    menuHtml += list.map(ent => {
                        const isActive = ent.id == currentId;
                        return `
                            <li>
                                <button class="entity-dropdown-item ${isActive ? 'active' : ''}" type="button" onclick="selectEntity(${ent.id}, '${ent.nome.replace(/'/g, "\\'")}')">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="bi bi-building"></i>
                                        <span>${ent.nome}</span>
                                    </div>
                                    ${isActive ? '<i class="bi bi-check2 text-primary fs-6"></i>' : ''}
                                </button>
                            </li>
                        `;
                    }).join('');
                }
                menu.innerHTML = menuHtml;

                const found = list.find(x => x.id == currentId);
                
                if (currentId === 'todas') {
                    document.getElementById('header-entity-name').textContent = 'Geral';
                    localStorage.setItem('selected_entidade_id', 'todas');
                    localStorage.setItem('selected_entidade_nome', 'Geral');
                } else if (found) {
                    document.getElementById('header-entity-name').textContent = found.nome;
                } else {
                    selectEntity('todas', 'Geral');
                }
            }
        } catch (e) {
            console.error("Erro ao carregar entidades para o dropdown:", e);
        }
    }

    function selectEntity(id, nome) {
        localStorage.setItem('selected_entidade_id', id);
        localStorage.setItem('selected_entidade_nome', nome);
        document.getElementById('header-entity-name').textContent = nome;
        
        checkEntityContext();
        
        if (typeof carregar === 'function') {
            carregar();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (!getToken()) { window.location.href = '/login/'; return; }
        const username = localStorage.getItem('username') || '';
        const fullname = localStorage.getItem('user_fullname') || username;
        if (username) {
            document.getElementById('current-user').textContent = fullname;
            
            // Computa as iniciais a partir do nome
            let initials = '';
            if (fullname) {
                const parts = fullname.trim().split(/\s+/);
                if (parts.length > 1) {
                    initials = (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
                } else if (parts.length > 0 && parts[0]) {
                    initials = parts[0].slice(0, 2).toUpperCase();
                }
            }
            if (!initials) initials = username.slice(0, 2).toUpperCase();
            
            document.getElementById('user-avatar').textContent = initials;
        }
        checkEntityContext();
    });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
