{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ReporTi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card" style="max-width:400px;">
        <div class="login-brand">
            <div class="login-brand-icon"><i class="bi bi-ticket-fill"></i></div>
            <span class="login-brand-name">ReporTi</span>
        </div>
        <p class="login-subtitle">Acesso para Gestores e Técnicos</p>

        <form onsubmit="loginAdmin(event)">
            <div class="mb-3">
                <label class="form-label" for="admin-email">E-mail</label>
                <input type="email" id="admin-email" class="form-control" placeholder="seu@email.com"
                       required autofocus autocomplete="email">
            </div>
            <div class="mb-4">
                <label class="form-label" for="admin-senha">Senha</label>
                <input type="password" id="admin-senha" class="form-control" placeholder="••••••••"
                       required autocomplete="current-password">
            </div>
            <div class="alert alert-danger py-2 px-3 mb-3" id="admin-erro" style="display:none;font-size:.8125rem;">
                <i class="bi bi-exclamation-circle me-1"></i><span id="admin-erro-msg"></span>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold" id="btn-admin">Entrar</button>
        </form>

        <p class="text-center mt-4 mb-0" style="font-size:.8125rem;color:#94A3B8;">
            Usuário comum? <a href="/acesso/" class="text-primary fw-semibold text-decoration-none">Acesse por aqui</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    if (localStorage.getItem('access')) window.location.href = '/';

    async function loginAdmin(e) {
        e.preventDefault();
        const btn  = document.getElementById('btn-admin');
        const erro = document.getElementById('admin-erro');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Entrando…';
        erro.style.display = 'none';

        const res = await fetch('/api/auth/token/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email:    document.getElementById('admin-email').value,
                password: document.getElementById('admin-senha').value,
            }),
        });

        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('access',  data.access);
            localStorage.setItem('refresh', data.refresh);
            if (data.usuario) localStorage.setItem('usuario', JSON.stringify(data.usuario));
            window.location.href = '/';
        } else {
            const data = await res.json().catch(() => ({}));
            const msgs = Object.values(data).flat();
            document.getElementById('admin-erro-msg').textContent =
                msgs.length ? msgs[0] : 'E-mail ou senha inválidos.';
            erro.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }
    }
</script>
</body>
</html>
