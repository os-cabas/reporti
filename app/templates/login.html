{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ReporTi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <p class="brand">ReporTi</p>
        <p class="subtitle">Sistema de Alertas de Hardware</p>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Usuário</label>
                <input type="text" id="username" class="form-control" placeholder="seu usuario gay 123" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small">Senha</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="alert alert-danger error-msg" id="error-msg">Usuário ou senha inválidos.</div>
            <button type="submit" class="btn btn-primary w-100" id="btn-login">Entrar</button>
        </form>
    </div>
</div>

<script>
    if (localStorage.getItem('access')) window.location.href = '/';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        const err = document.getElementById('error-msg');
        btn.disabled = true;
        btn.textContent = 'Entrando...';
        err.style.display = 'none';

        const res = await fetch('/api/auth/token/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
            }),
        });

        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('access', data.access);
            localStorage.setItem('refresh', data.refresh);
            localStorage.setItem('username', document.getElementById('username').value);
            window.location.href = '/';
        } else {
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }
    });
</script>
</body>
</html>
