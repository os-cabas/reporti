{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563EB">
    <title>Login — ReporTi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #F0F5FF;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ── Brand ─────────────────────────────────────── */
        .brand {
            background: linear-gradient(145deg, #3B82F6 0%, #1D4ED8 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.75rem 1.5rem 2.25rem;
            text-align: center;
        }
        .brand-icon {
            width: 68px; height: 68px;
            background: rgba(255,255,255,.18);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.875rem;
            margin-bottom: .875rem;
        }
        .brand-name {
            font-size: 2rem; font-weight: 800;
            letter-spacing: -.5px; margin: 0 0 .25rem;
        }
        .brand-sub {
            font-size: .9375rem; opacity: .82; margin: 0;
        }

        /* ── Content area ───────────────────────────────── */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem 1.375rem;
            width: 100%; max-width: 460px;
            margin: 0 auto;
        }

        /* ── Labels & inputs ────────────────────────────── */
        .field-label {
            display: block;
            font-size: .8125rem; font-weight: 600; color: #475569;
            margin-bottom: .4rem;
        }
        .input-field {
            width: 100%;
            padding: .875rem 1rem;
            border: 1.5px solid #D1D9E6; border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: #1E293B; background: #fff;
            outline: none;
            transition: border-color .15s;
            -webkit-appearance: none;
            appearance: none;
            margin-bottom: .875rem;
        }
        .input-field:focus  { border-color: #3B82F6; }
        .input-field::placeholder { color: #9FAABC; }

        /* ── Primary button ─────────────────────────────── */
        .btn-primary {
            width: 100%;
            padding: .9375rem 1.25rem;
            border: none; border-radius: 14px;
            background: #2563EB;
            font-family: 'Inter', sans-serif;
            font-size: 1rem; font-weight: 600; color: #fff;
            display: flex; align-items: center; justify-content: center; gap: .5rem;
            cursor: pointer;
            transition: background .15s, transform .1s;
            -webkit-tap-highlight-color: transparent;
            margin-top: .25rem;
        }
        .btn-primary:hover  { background: #1D4ED8; }
        .btn-primary:active { transform: scale(.98); }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

        /* ── Error ──────────────────────────────────────── */
        .alert-erro {
            background: #FEF2F2; border: 1px solid #FECACA;
            border-radius: 10px; color: #DC2626;
            padding: .7rem 1rem; font-size: .875rem;
            margin-bottom: .875rem; display: none;
        }

        /* ── Spinner ────────────────────────────────────── */
        .spin {
            width: 18px; height: 18px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: rot .65s linear infinite;
            flex-shrink: 0;
        }
        @keyframes rot { to { transform: rotate(360deg); } }

        /* ── Footer link ────────────────────────────────── */
        .footer-note {
            text-align: center; margin-top: auto; padding-top: 1.5rem;
            font-size: .8125rem; color: #94A3B8;
        }
        .footer-note a { color: #3B82F6; font-weight: 600; text-decoration: none; }

        /* ── Safe area (notch phones) ───────────────────── */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .content { padding-bottom: calc(1.75rem + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>

<!-- ── Brand ──────────────────────────────────────────────────────────────── -->
<div class="brand">
    <div class="brand-icon"><i class="bi bi-ticket-fill"></i></div>
    <p class="brand-name">ReporTi</p>
    <p class="brand-sub">Acesso para Gestores e Técnicos</p>
</div>

<!-- ── Form ───────────────────────────────────────────────────────────────── -->
<div class="content">
    <form onsubmit="loginAdmin(event)" style="display:contents;">
        <label class="field-label" for="admin-email">E-mail</label>
        <input type="email" id="admin-email" class="input-field"
               placeholder="seu@email.com"
               required autofocus autocomplete="email">

        <label class="field-label" for="admin-senha">Senha</label>
        <input type="password" id="admin-senha" class="input-field"
               placeholder="••••••••"
               required autocomplete="current-password">

        <div class="alert-erro" id="admin-erro">
            <i class="bi bi-exclamation-circle me-1"></i><span id="admin-erro-msg"></span>
        </div>

        <button type="submit" class="btn-primary" id="btn-admin">Entrar</button>
    </form>

    <p class="footer-note">
        Usuário comum? <a href="/acesso/">Acesse por aqui</a>
    </p>
</div>

<script>
    if (localStorage.getItem('access')) window.location.href = '/';

    async function loginAdmin(e) {
        e.preventDefault();
        const btn  = document.getElementById('btn-admin');
        const erro = document.getElementById('admin-erro');
        btn.disabled = true;
        btn.innerHTML = '<span class="spin"></span>Entrando…';
        erro.style.display = 'none';

        const res = await fetch('/api/auth/token/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email:    document.getElementById('admin-email').value,
                password: document.getElementById('admin-senha').value,
            }),
        });

        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('access',  data.access);
            localStorage.setItem('refresh', data.refresh);
            if (data.usuario) localStorage.setItem('usuario', JSON.stringify(data.usuario));
            window.location.href = '/';
        } else {
            const data = await res.json().catch(() => ({}));
            const msgs = Object.values(data).flat();
            document.getElementById('admin-erro-msg').textContent =
                msgs.length ? msgs[0] : 'E-mail ou senha inválidos.';
            erro.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }
    }
</script>
</body>
</html>
