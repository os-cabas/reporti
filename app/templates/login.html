{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ReporTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">

</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-brand">
            <div class="login-brand-icon"><i class="bi bi-ticket-fill"></i></div>
            <span class="login-brand-name">ReporTI</span>
        </div>
        <p class="login-subtitle">Sistema de Gerenciamento de Chamados</p>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label" for="username_or_email">Usuário ou E-mail</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" id="username_or_email" class="form-control border-start-0 ps-0" placeholder="usuario ou seu@email.com" required autofocus autocomplete="username">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <div class="alert alert-danger error-msg py-2 px-3 mb-3" id="error-msg">
                <i class="bi bi-exclamation-circle me-1"></i>Usuário ou senha inválidos.
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-semibold py-2" id="btn-login">
                Entrar
            </button>
        </form>

        <div class="divider-container">
            <span class="divider-text">ou continue com</span>
        </div>

        <button type="button" class="gsi-material-button mb-4" id="btn-google">
          <div class="gsi-material-button-state"></div>
          <div class="gsi-material-button-content-wrapper">
            <div class="gsi-material-button-icon">
              <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                <path fill="none" d="M0 0h48v48H0z"></path>
              </svg>
            </div>
            <span class="gsi-material-button-contents">Entrar com o Google</span>
            <span style="display: none;">Entrar com o Google</span>
          </div>
        </button>

        <div class="text-center mt-3">
            <p class="mb-0 text-secondary small">
                Não tem uma conta? <a href="/cadastro/" class="text-primary fw-semibold text-decoration-none">Cadastre-se agora</a>
            </p>
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem('access')) window.location.href = '/';

    // Inicializar banco de dados mockado a partir do arquivo mock_dados/usuarios.json
    async function inicializarMockUsers() {
        if (!localStorage.getItem('mock_users')) {
            try {
                const res = await fetch('/static/usuarios.json');
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('mock_users', JSON.stringify(data));
                }
            } catch (e) {
                console.error("Erro ao carregar dados mockados iniciais:", e);
            }
        }
    }
    inicializarMockUsers();

    // Handler para login com Google (Mockado)
    document.getElementById('btn-google').addEventListener('click', () => {
        const btn = document.getElementById('btn-google');
        btn.disabled = true;
        btn.querySelector('.gsi-material-button-contents').textContent = 'Conectando...';

        setTimeout(() => {
            localStorage.setItem('access', 'mock-google-access-token');
            localStorage.setItem('refresh', 'mock-google-refresh-token');
            localStorage.setItem('username', 'usuario.google');
            localStorage.setItem('user_email', 'usuario@google.com');
            localStorage.setItem('user_fullname', 'Usuário Google');
            window.location.href = '/';
        }, 1200);
    });

    // Handler para login principal
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        const err = document.getElementById('error-msg');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Entrando...';
        err.style.display = 'none';

        const usernameOrEmail = document.getElementById('username_or_email').value;
        const password = document.getElementById('password').value;

        // 1. Verificar usuários cadastrados no localStorage (Mockados)
        const mockUsers = JSON.parse(localStorage.getItem('mock_users') || '[]');
        const foundMockUser = mockUsers.find(u => 
            (u.username === usernameOrEmail || u.email === usernameOrEmail) && u.password === password
        );

        if (foundMockUser) {
            setTimeout(() => {
                localStorage.setItem('access', 'mock-access-token-' + Date.now());
                localStorage.setItem('refresh', 'mock-refresh-token-' + Date.now());
                localStorage.setItem('username', foundMockUser.username);
                localStorage.setItem('user_email', foundMockUser.email);
                localStorage.setItem('user_fullname', foundMockUser.fullname || foundMockUser.username);
                window.location.href = '/';
            }, 800);
            return;
        }

        // 2. Se não achou localmente, tentar autenticação real do backend (Django/JWT)
        try {
            const res = await fetch('/api/auth/token/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: usernameOrEmail,
                    password: password,
                }),
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('access', data.access);
                localStorage.setItem('refresh', data.refresh);
                localStorage.setItem('username', usernameOrEmail);
                window.location.href = '/';
            } else {
                err.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        } catch (error) {
            console.error('Erro de conexão ao servidor:', error);
            err.textContent = 'Erro de conexão com o servidor.';
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }
    });
</script>
</body>
</html>
