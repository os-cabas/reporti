{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ReporTi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-brand">
            <div class="login-brand-icon"><i class="bi bi-ticket-fill"></i></div>
            <span class="login-brand-name">ReporTi</span>
        </div>
        <p class="login-subtitle">Sistema de Gerenciamento de Chamados</p>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label" for="username">Usuário</label>
                <input type="text" id="username" class="form-control" placeholder="seu.usuario" required autofocus autocomplete="username">
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Senha</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <div class="alert alert-danger error-msg py-2 px-3" id="error-msg">
                <i class="bi bi-exclamation-circle me-1"></i>Usuário ou senha inválidos.
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold" id="btn-login">
                Entrar
            </button>
        </form>
    </div>
</div>

<script>
    if (localStorage.getItem('access')) window.location.href = '/';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        const err = document.getElementById('error-msg');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Entrando...';
        err.style.display = 'none';

        const res = await fetch('/api/auth/token/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
            }),
        });

        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('access', data.access);
            localStorage.setItem('refresh', data.refresh);
            localStorage.setItem('username', document.getElementById('username').value);
            window.location.href = '/';
        } else {
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }
    });
</script>
</body>
</html>
